<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web AR Audio Marker</title>
    <!-- Library wajib MindAR (Jangan diubah) -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      #audio-hint {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        background: rgba(0, 0, 0, 0.72);
        color: #fff;
        padding: 8px 14px;
        border-radius: 999px;
        font-family: sans-serif;
        font-size: 13px;
        pointer-events: none;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="audio-hint">Arahkan kamera ke marker. Ketuk layar jika suara belum bunyi.</div>

    <!-- BAGIAN 1: Ganti 'targets.mind' sesuai nama file .mind Anda -->
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <!-- BAGIAN 2: Daftarkan semua file suara (.mp3) Anda di sini -->
      <a-assets>
        <audio id="audio-sumatrautara" src="./sumatrautara.mp3" preload="auto"></audio>
        <audio id="audio-jawatengah" src="./jawatengah.mp3" preload="auto"></audio>
        <audio id="audio-sulawesiselatan" src="./sulawesiselatan.mp3" preload="auto"></audio>
        <audio id="audio-aceh" src="./aceh.mp3" preload="auto"></audio>
        <audio id="audio-kalimantantimur" src="./kalimantantimur.mp3" preload="auto"></audio>
        <audio id="audio-papua" src="./papua.mp3" preload="auto"></audio>
        <audio id="audio-maluku" src="./maluku.mp3" preload="auto"></audio>
        <audio id="audio-gorontalo" src="./gorontalo.mp3" preload="auto"></audio>
        <audio id="audio-bali" src="./bali.mp3" preload="auto"></audio>
        <audio id="audio-riau" src="./riau.mp3" preload="auto"></audio>
        <audio id="audio-jambi" src="./jambi.mp3" preload="auto"></audio>
        <audio id="audio-bangkabelitung" src="./bangkabelitung.mp3" preload="auto"></audio>
        <audio id="audio-bengkulu" src="./bengkulu.mp3" preload="auto"></audio>
        <audio id="audio-lampung" src="./lampung.mp3" preload="auto"></audio>
        <audio id="audio-jakarta" src="./jakarta.mp3" preload="auto"></audio>
        <audio id="audio-jawabarat" src="./jawabarat.mp3" preload="auto"></audio>
        <audio id="audio-banten" src="./banten.mp3" preload="auto"></audio>
        <audio id="audio-diyogyakarta" src="./diyogyakarta.mp3" preload="auto"></audio>
        <audio id="audio-jawatimur" src="./jawatimur.mp3" preload="auto"></audio>
        <audio id="audio-ntb" src="./ntb.mp3" preload="auto"></audio>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- BAGIAN 3: Pasangkan urutan kartu dengan suara (tanpa model 3D) -->
      <a-entity mindar-image-target="targetIndex: 0" data-audio="audio-sumatrautara"></a-entity>
      <a-entity mindar-image-target="targetIndex: 1" data-audio="audio-jawatengah"></a-entity>
      <a-entity mindar-image-target="targetIndex: 2" data-audio="audio-sulawesiselatan"></a-entity>
      <a-entity mindar-image-target="targetIndex: 3" data-audio="audio-aceh"></a-entity>
      <a-entity mindar-image-target="targetIndex: 4" data-audio="audio-kalimantantimur"></a-entity>
      <a-entity mindar-image-target="targetIndex: 5" data-audio="audio-papua"></a-entity>
      <a-entity mindar-image-target="targetIndex: 6" data-audio="audio-maluku"></a-entity>
      <a-entity mindar-image-target="targetIndex: 7" data-audio="audio-gorontalo"></a-entity>
      <a-entity mindar-image-target="targetIndex: 8" data-audio="audio-bali"></a-entity>
      <a-entity mindar-image-target="targetIndex: 9" data-audio="audio-riau"></a-entity>
      <a-entity mindar-image-target="targetIndex: 10" data-audio="audio-jambi"></a-entity>
      <a-entity mindar-image-target="targetIndex: 11" data-audio="audio-bangkabelitung"></a-entity>
      <a-entity mindar-image-target="targetIndex: 12" data-audio="audio-bengkulu"></a-entity>
      <a-entity mindar-image-target="targetIndex: 13" data-audio="audio-lampung"></a-entity>
      <a-entity mindar-image-target="targetIndex: 14" data-audio="audio-jakarta"></a-entity>
      <a-entity mindar-image-target="targetIndex: 15" data-audio="audio-jawabarat"></a-entity>
      <a-entity mindar-image-target="targetIndex: 16" data-audio="audio-banten"></a-entity>
      <a-entity mindar-image-target="targetIndex: 17" data-audio="audio-diyogyakarta"></a-entity>
      <a-entity mindar-image-target="targetIndex: 18" data-audio="audio-jawatimur"></a-entity>
      <a-entity mindar-image-target="targetIndex: 19" data-audio="audio-ntb"></a-entity>
    </a-scene>

    <script>
      const hint = document.getElementById("audio-hint");
      let activeAudio = null;

      function stopActiveAudio() {
        if (activeAudio) {
          activeAudio.pause();
          activeAudio.currentTime = 0;
          activeAudio = null;
        }
      }

      document.querySelectorAll("[mindar-image-target]").forEach((targetEl) => {
        const audioId = targetEl.getAttribute("data-audio");
        const audioEl = document.getElementById(audioId);

        targetEl.addEventListener("targetFound", () => {
          if (!audioEl) return;
          stopActiveAudio();
          activeAudio = audioEl;
          audioEl.currentTime = 0;
          audioEl
            .play()
            .then(() => {
              hint.textContent = "Memutar suara...";
            })
            .catch(() => {
              hint.textContent = "Ketuk layar untuk mengizinkan suara";
            });
        });

        targetEl.addEventListener("targetLost", () => {
          if (activeAudio === audioEl) {
            stopActiveAudio();
            hint.textContent = "Arahkan kamera ke marker";
          }
        });
      });

      // Cadangan jika browser memblokir autoplay sebelum ada interaksi sentuhan/klik
      document.body.addEventListener("click", () => {
        if (activeAudio && activeAudio.paused) {
          activeAudio.play().catch(() => {});
          hint.textContent = "Memutar suara...";
        }
      });
    </script>
  </body>
</html>
